# Harris County, Texas (Houston). Harris Central Appraisal District (HCAD) bulk data.
# The worked example this project was built on. Update the year in the URLs each fall
# when HCAD posts the new certified roll.
name: Harris County, TX
short_name: Harris County
state: TX
adapter: hcad
roll_source: HCAD 2026 certified roll (download.hcad.org)
bbox: [-95.97, 29.49, -94.90, 30.18]     # west, south, east, north (lon/lat): canopy clip and storm search
nws_offices: [HGX]                         # NWS Houston/Galveston

downloads:                                 # ~650 MB zipped, ~4.5 GB unzipped
  - {url: "https://download.hcad.org/data/CAMA/2026/Real_acct_owner.zip", unzip_to: Real_acct_owner}
  - {url: "https://download.hcad.org/data/CAMA/2026/Real_building_land.zip", unzip_to: Real_building_land}
  - {url: "https://download.hcad.org/data/GIS/Parcels.zip", unzip_to: Parcels}

