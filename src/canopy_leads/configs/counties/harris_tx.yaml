# Local names added to the trade's keywords
keyword_additions:
  PUBLIC: "PORT OF HOUSTON|UNIVERSITY OF HOUSTON|TEXAS SOUTHERN UNIV|TEXAS A ?& ?M|UNIVERSITY OF TEXAS|LONE STAR COLLEGE|SAN JACINTO COLLEGE|HOUSTON COMMUNITY COLLEGE|TEXAS DEPARTMENT|TX DEPT|STATE OF TX"
  HOSPITAL: "MEMORIAL HERMANN|HOUSTON METHODIST|\\bST\\.? LUKE|TEXAS CHILDREN|MD ANDERSON|BAYLOR (COLLEGE OF MEDICINE|ST)|\\bHCA\\b|KELSEY"
  # Texas property-tax consultants appear as care-of on thousands of accounts; they never buy grounds work
  TAX_AGENT: "\\bRYAN\\b|POPP HUTCHESON|O ?CONNOR|MARVIN POER|KE ANDREWS|DUCHARME|PARADIGM|TPTS|NORTH AMERICAN PROPERTY TAX|INVOKE"

# Texas HHSC licensed long-term care directories: confirm senior living and name the operator
licensed_facilities:
  segment: senior
  keep_segments: [mud]
  source: Texas HHSC long-term care provider directories (apps.hhs.texas.gov)
  files:
    - {url: "https://apps.hhs.texas.gov/providers/directories/al.xlsx", path: hhsc/al.xlsx, header_row: 1, filters: {County: HARRIS}}
    - {url: "https://apps.hhs.texas.gov/providers/directories/NF.xlsx", path: hhsc/NF.xlsx, header_row: 1, filters: {County: HARRIS}}
  columns: {name: Facility Name, latlon: Geo Location, operator: Management Company, phone: Facility Phone Number}

# The region's defining storms (see storms.py for the methods). Swap these for each region:
# Central Texas might use the February 2021 freeze; Oklahoma a tornado outbreak.
storm_events:
  - name: Hurricane Beryl
    start: 2024-07-08T00:00Z
    end: 2024-07-09T06:00Z
    method: gust_field
    weight: 0.40
    gust_low: 60
    gust_high: 85
    hook_mph: 76
  - name: May 2024 derecho
    start: 2024-05-16T18:00Z
    end: 2024-05-17T06:00Z
    method: nearest_report
    weight: 0.35
    full_km: 2
    zero_km: 15
  - name: Last 12 months
    days: 365
    method: recent
    weight: 0.25

sources:
  - {source: HCAD certified roll and GIS parcels, url: "https://download.hcad.org/", used_for: "owners, mailing / care-of lines, acreage, land and building codes, parcel outlines"}
  - {source: Texas HHSC long-term care directories, url: "https://apps.hhs.texas.gov/providers/directories/", used_for: senior living operators and facility phones}
  - {source: TCEQ water district records, url: "https://www14.tceq.texas.gov/iwud/", used_for: "district operators (manual research, contacts step)"}
