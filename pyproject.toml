[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "territory-gtm"
version = "0.1.0"
description = "Turn a county tax roll into a ranked B2B account list for field-service companies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "rasterio>=1.3",
    "rasterstats>=0.19",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tgtm = "territory_gtm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
territory_gtm = ["configs/**/*.yaml", "configs/**/*.csv"]
